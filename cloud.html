<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYZ | Cloud Storage</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow-x: hidden;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }
      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #00ff80, #00ff00, #00ff80);
        background-size: 400% 400%;
        animation: gradientShift 5s ease infinite;
        z-index: -5;
        transition: 3s;
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6;
        z-index: -4;
      }
      .orb1 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, #00fff2, transparent);
        top: -100px;
        left: -100px;
        animation: float 25s ease-in-out infinite;
      }
      .orb2 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #0080ff, transparent);
        bottom: -100px;
        right: -100px;
        animation: float 15s ease-in-out infinite reverse;
      }
      .orb3 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, #00ff80, transparent);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 15s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(100px, -100px) scale(1.1);
        }
        66% {
          transform: translate(-100px, 100px) scale(0.9);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0.4;
        }
      }
      .glow-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.1),
          transparent 70%
        );
        pointer-events: none;
        animation: glowPulse 8s ease-in-out infinite;
        z-index: -2;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        color: white;
      }
      .site {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 10;
        padding-bottom: 20px;
      }
      header {
        width: 90%;
        min-height: 80px;
        margin-top: 20px;
        border-radius: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        flex-wrap: wrap;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      .nav-links {
        display: flex;
        align-items: center;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-weight: 500;
        transition: color 0.3s ease;
      }
      .nav-links a:hover {
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff;
      }
      .page {
        display: flex;
        justify-content: space-between;
        flex-direction: row;
        width: 90%;
        flex: 1;
        margin: 20px 0;
        gap: 20px;
      }
      .page > div {
        border-radius: 20px;
        padding: 30px;
        display: flex;
        flex-direction: column;
      }
      .main-panel {
        transform: scale(1.5);
        width: 58%;
        justify-content: center;
        align-items: center;
        text-align: center;
        border-radius: 25px;
        margin-top: 15%;
      }
      .menu-list {
        list-style: none;
        margin-top: 10px;
      }
      .menu-list li {
        padding: 15px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.9rem;
      }
      .menu-list li:hover {
        background: rgba(255, 255, 255, 0.1);
        padding-left: 20px;
      }
      ul a {
        color: inherit;
        text-decoration: none;
      }

      @media (max-width: 1024px) {
        .page {
          flex-wrap: wrap;
          height: auto;
        }
        .main-panel {
          width: 100%;
          order: 1;
          margin-bottom: 20px;
        }
      }
      @media (max-width: 768px) {
        body {
          overflow-y: auto;
        }
        header {
          flex-direction: column;
          gap: 15px;
          padding: 20px;
        }
        .nav-links {
          margin-left: 0;
          gap: 15px;
        }
        .nav-links a {
          margin: 0;
          font-size: 0.9rem;
        }
        .page {
          flex-direction: column;
          gap: 20px;
          margin-top: 10px;
        }
        .main-panel {
          width: 100%;
          order: 1;
          padding: 40px 20px;
        }
        .orb {
          opacity: 0.4;
        }
      }
      .analytics-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        perspective: 800px;
      }
      .data-cube-container {
        width: 200px;
        height: 200px;
        margin: 50px auto;
        transform-style: preserve-3d;
        animation: rotateView 10s linear infinite;
      }
      @keyframes rotateView {
        0% {
          transform: rotateY(0deg) rotateX(15deg);
        }
        100% {
          transform: rotateY(360deg) rotateX(15deg);
        }
      }
      .data-cube {
        width: 100%;
        height: 100%;
        position: absolute;
        transform-style: preserve-3d;
      }
      .cube-face {
        position: absolute;
        width: 200px;
        height: 200px;
        border: 1px solid #00ffff;
        background: rgba(0, 255, 255, 0.05);
        box-shadow: 0 0 10px #00ffff inset;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0.8;
      }
      .cube-face:nth-child(1) {
        transform: rotateY(0deg) translateZ(100px);
      }
      .cube-face:nth-child(2) {
        transform: rotateY(90deg) translateZ(100px);
      }
      .cube-face:nth-child(3) {
        transform: rotateY(180deg) translateZ(100px);
      }
      .cube-face:nth-child(4) {
        transform: rotateY(-90deg) translateZ(100px);
      }
      .cube-face:nth-child(5) {
        transform: rotateX(90deg) translateZ(100px);
      }
      .cube-face:nth-child(6) {
        transform: rotateX(-90deg) translateZ(100px);
      }

      .cube-face:nth-child(5) .data-pulse-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 5px;
        width: 90%;
        height: 90%;
      }
      .data-point {
        width: 100%;
        height: 100%;
        background: #ff00ff;
        opacity: 0.1;
        animation: dataPulse 1.5s ease-in-out infinite alternate;
      }
      .data-point:nth-child(even) {
        animation-delay: 0.2s;
      }
      .data-point:nth-child(3n) {
        animation-delay: 0.4s;
      }

      @keyframes dataPulse {
        0% {
          opacity: 0.1;
          background: #ff00ff;
        }
        100% {
          opacity: 0.6;
          background: #00ffff;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="glow-overlay"></div>

    <div class="site">
      <header class="glass-panel">
        <div class="logo">XYZ SYSTEMS</div>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="index.html">Solutions</a>
          <a href="index.html">Vision</a>
          <a href="index.html">Login</a>
        </div>
      </header>

      <div class="main-panel glass-panel">
          <div class="analytics-content">
            <h1>COMPLEX DATA MAPPING</h1>
            <p class="subtitle">
              Visualizing the <b>Hyper-Metric Flow</b> inside the primary
              processing cluster. Real-time trend identification is active.
            </p>
            <div class="data-cube-container">
              <div class="data-cube">
                <div class="cube-face">DATA STREAM</div>
                <div class="cube-face">
                </div>
                <div class="cube-face">
                </div>
                <div class="cube-face"></div>
                <div class="cube-face">
                  <div class="data-pulse-grid">
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                    <div class="data-point"></div>
                  </div>
                </div>
                <div class="cube-face"></div>
              </div>
            </div>
            <p class="subtitle" style="margin-bottom: 0">
              Core Status: <b>Processing at 98% efficiency</b>.
            </p>
          </div>
        </div>
    </div>
  </body>
</html>
