<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XYZ | Analytics</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #000;
        overflow-x: hidden;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }
      .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #3d0000, #ff0000, #3d0000);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        z-index: -5;
      }
      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6;
        z-index: -4;
      }
      .orb1 {
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, #ff0080, transparent);
        top: -100px;
        left: -100px;
        animation: float 25s ease-in-out infinite;
      }
      .orb2 {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #830000, transparent);
        bottom: -100px;
        right: -100px;
        animation: float 20s ease-in-out infinite reverse;
      }
      .orb3 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, #000000, transparent);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 5s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(100px, -100px) scale(1.1);
        }
        66% {
          transform: translate(-100px, 100px) scale(0.9);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0.4;
        }
      }
      .glow-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(255, 255, 255, 0.1),
          transparent 70%
        );
        pointer-events: none;
        animation: glowPulse 8s ease-in-out infinite;
        z-index: -2;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        color: white;
      }
      .site {
        width: 100vw;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 10;
        padding-bottom: 20px;
      }
      header {
        width: 90%;
        min-height: 80px;
        margin-top: 20px;
        border-radius: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        flex-wrap: wrap;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      .nav-links {
        display: flex;
        align-items: center;
      }
      .nav-links a {
        color: white;
        text-decoration: none;
        margin-left: 20px;
        font-weight: 500;
        transition: color 0.3s ease;
      }
      .nav-links a:hover {
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff;
      }
      .page {
        display: flex;
        justify-content: space-between;
        flex-direction: row;
        width: 90%;
        flex: 1;
        margin: 20px 0;
        gap: 20px;
      }
      .page > div {
        border-radius: 20px;
        padding: 30px;
        display: flex;
        flex-direction: column;
      }
      .main-panel {
        width: 90%;
        height: 90%;
        justify-content: center;
        align-items: center;
        text-align: center;
        border-radius: 30px 30px 0 0;
        margin-top: 10%;
      }
      .menu-list {
        list-style: none;
        margin-top: 10px;
      }
      .menu-list li {
        padding: 15px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.9rem;
      }
      .menu-list li:hover {
        background: rgba(255, 255, 255, 0.1);
        padding-left: 20px;
      }
      ul a {
        color: inherit;
        text-decoration: none;
      }
      #footers {
        width: 90%;
        display: flex;
        gap: 20px;
        flex-shrink: 0;
      }
      footer {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 15px;
        font-size: 0.9rem;
        padding: 20px;
      }
      #footer {
        width: 70%;
        justify-content: space-between;
      }
      #footer2 {
        width: 30%;
      }

      @media (max-width: 1024px) {
        .page {
          flex-wrap: wrap;
          height: auto;
        }
        .main-panel {
          width: 100%;
          order: 1;
          margin-bottom: 20px;
        }
      }
      @media (max-width: 768px) {
        body {
          overflow-y: auto;
        }
        header {
          flex-direction: column;
          gap: 15px;
          padding: 20px;
        }
        .nav-links {
          margin-left: 0;
          gap: 15px;
        }
        .nav-links a {
          margin: 0;
          font-size: 0.9rem;
        }
        .page {
          flex-direction: column;
          gap: 20px;
          margin-top: 10px;
        }
        .main-panel {
          width: 100%;
          order: 1;
          padding: 40px 20px;
        }
        .orb {
          opacity: 0.4;
        }
      }
      .chart-container {
        width: 100%;
        height: 600px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      }

        border-radius: 3px 3px 0 0;
        box-shadow: 0 0 8px #000000;
        animation: chartMove 1s ease-in-out infinite alternate;
        transform-origin: bottom;
